; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev          ; keeps `pio run` / `pio run -t upload` unchanged

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1340
monitor_port = /dev/cu.usbserial-1340

; Required libraries
lib_deps =
    adafruit/Adafruit VEML7700 Library@^2.1.5
    arduino-libraries/NTPClient@^3.2.1
    esp32async/ESPAsyncWebServer@^3.12.1
    esp32async/AsyncTCP@^3.5.0

; Optional: Enable serial monitor filters
monitor_filters = esp32_exception_decoder

; Build flags for debugging (optional)
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:native]
platform = native
build_src_filter = +<controllogic.cpp>
test_build_src = true